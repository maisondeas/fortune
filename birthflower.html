<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>誕生花占い ― あなたの花と今日のお告げ</title>
<meta name="description" content="生まれた日の花から、あなたの性格と今日のお告げを占います。">
<style>
  :root {
    --petal1: #fdf3ef;
    --petal2: #f7e0d8;
    --petal3: #efcec5;
    --berry: #a8475c;
    --berry-soft: #c07a86;
    --leaf: #758a63;
    --leaf-soft: #93a684;
    --bark: #4a3239;
    --bark-soft: #7c626a;
    --bark-faint: #a58d94;
    --card: rgba(255, 252, 250, 0.78);
    --line: rgba(168, 71, 92, 0.22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(180deg, var(--petal1) 0%, var(--petal2) 58%, var(--petal3) 100%);
    color: var(--bark);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }
  /* 舞う花びら */
  .field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 36% at 50% 0%, rgba(255, 255, 255, 0.72), transparent 62%),
      radial-gradient(circle at 10% 92%, rgba(117, 138, 99, 0.12), transparent 48%);
  }
  .fleck {
    position: absolute;
    background: var(--berry-soft);
    border-radius: 60% 0 60% 0;
    opacity: 0.16;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    padding: 40px 20px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-align: center;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--bark-soft);
    margin-top: 10px;
    text-align: center;
    line-height: 1.7;
  }
  .divider {
    width: 96px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--berry-soft), transparent);
    margin: 22px auto 26px;
  }
  /* 入力 */
  .input-block {
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }
  .input-block > label {
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--bark-soft);
    margin-bottom: 12px;
  }
  .selects { display: flex; gap: 10px; align-items: center; width: 100%; }
  .sel-wrap { flex: 1; display: flex; align-items: center; gap: 6px; }
  select {
    flex: 1;
    font-size: 16px;
    font-family: inherit;
    padding: 11px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.72);
    color: var(--bark);
    outline: none;
    text-align: center;
    -webkit-appearance: none;
    appearance: none;
  }
  select:focus { border-color: var(--berry); }
  .unit { font-size: 14px; color: var(--bark-soft); flex-shrink: 0; }
  button.cast {
    margin-top: 20px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.12em;
    padding: 13px 44px;
    border-radius: 999px;
    border: 1px solid var(--berry);
    background: transparent;
    color: var(--berry);
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  button.cast:active { background: var(--berry); color: var(--petal1); }
  /* 結果 */
  .result-area {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 0.7s ease both;
  }
  .result-area.show { display: flex; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .result-area { animation: none !important; }
    .petal { animation: none !important; }
  }
  .born-label {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--bark-faint);
    margin-bottom: 14px;
  }
  /* CSSで描く花 */
  .bloom {
    position: relative;
    width: 116px;
    height: 116px;
    margin-bottom: 18px;
  }
  .petal {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 30px;
    height: 52px;
    margin-left: -15px;
    margin-top: -52px;
    border-radius: 50% 50% 46% 46%;
    transform-origin: 50% 100%;
    opacity: 0.92;
    animation: bloomIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
  }
  @keyframes bloomIn {
    from { transform: rotate(var(--rot)) scale(0.2); opacity: 0; }
    to { transform: rotate(var(--rot)) scale(1); opacity: 0.92; }
  }
  .bloom-core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #ffe9a8, #e8b84d);
    box-shadow: 0 0 0 1px rgba(74, 50, 57, 0.12);
    z-index: 2;
  }
  .flower-name {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-align: center;
  }
  .flower-reading {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--bark-faint);
    margin-top: 5px;
    text-align: center;
  }
  .hanakotoba {
    display: inline-block;
    margin: 16px 0 4px;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--berry);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 6px 20px;
  }
  .hanakotoba-lead {
    font-size: 10.5px;
    letter-spacing: 0.24em;
    color: var(--bark-faint);
    margin-bottom: 8px;
  }
  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-top: 22px;
  }
  .card + .card { margin-top: 14px; }
  .card-label {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--berry);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .card-text {
    font-size: 14.5px;
    line-height: 1.95;
    letter-spacing: 0.03em;
  }
  .stem {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .stem-name {
    flex-shrink: 0;
    width: 4.4em;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--bark-soft);
  }
  .stem-text { font-size: 13.5px; }
  .swatch {
    display: inline-block;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 1px solid rgba(74, 50, 57, 0.22);
    margin-right: 8px;
    vertical-align: -2px;
  }
  .today-note {
    font-size: 11.5px;
    letter-spacing: 0.1em;
    color: var(--bark-faint);
    margin-top: 10px;
  }
  button.retry {
    margin-top: 28px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.1em;
    padding: 12px 34px;
    border-radius: 999px;
    border: 1px solid var(--leaf-soft);
    background: transparent;
    color: var(--bark-soft);
    cursor: pointer;
    transition: background 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  button.retry:active { background: rgba(117, 138, 99, 0.16); }
  footer {
    position: relative;
    z-index: 1;
    font-size: 11px;
    color: var(--bark-faint);
    padding: 0 16px 26px;
    text-align: center;
    line-height: 2.1;
  }
  footer a { color: var(--berry); text-decoration: none; }
  footer a:active { opacity: 0.7; }
  @media (min-width: 600px) {
    h1 { font-size: 29px; }
    .flower-name { font-size: 30px; }
    .bloom { width: 132px; height: 132px; }
  }
</style>
</head>
<body>
<div class="field" id="field"></div>
<main>
  <h1>誕 生 花 占 い</h1>
  <p class="subtitle">生まれた日に咲く花が、<br>あなたの人柄と今日を語ります</p>
  <div class="divider"></div>

  <div class="input-block" id="inputBlock">
    <label for="selMonth">生まれた月日を選んでください</label>
    <div class="selects">
      <div class="sel-wrap">
        <select id="selMonth" aria-label="月"></select><span class="unit">月</span>
      </div>
      <div class="sel-wrap">
        <select id="selDay" aria-label="日"></select><span class="unit">日</span>
      </div>
    </div>
    <button class="cast" id="castBtn">占う</button>
  </div>

  <div class="result-area" id="resultArea">
    <p class="born-label" id="bornLabel"></p>

    <div class="bloom" id="bloom">
      <div class="bloom-core"></div>
    </div>

    <div class="flower-name" id="flowerName"></div>
    <div class="flower-reading" id="flowerReading"></div>

    <div style="text-align:center; margin-top:18px;">
      <div class="hanakotoba-lead">花 言 葉</div>
      <div class="hanakotoba" id="hanakotoba"></div>
    </div>

    <div class="card">
      <div class="card-label">あなたの人柄</div>
      <p class="card-text" id="personality"></p>
      <div class="stem">
        <div class="stem-name">花の色</div>
        <div class="stem-text" id="flowerColor"></div>
      </div>
      <div class="stem">
        <div class="stem-name">咲く季節</div>
        <div class="stem-text" id="flowerSeason"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">今日のお告げ</div>
      <p class="card-text" id="oracle"></p>
      <p class="today-note" id="todayNote"></p>
    </div>

    <button class="retry" id="retryBtn">月日を選び直す</button>
  </div>
</main>
<footer>
  ※誕生花の割り当ては書物や花店によって異なります。<br>
  当ページは季節に沿った独自の対応でご案内しています。<br>
  占い結果は娯楽としてお楽しみください。<br>
  <a href="index.html">占いの扉へ戻る</a>
</footer>

(function () {

    const f = document.createElement("div");

    f.style.top = Math.random() * 100 + "%";
    f.style.transform = "rotate(" + (Math.random() * 360) + "deg)";

// ---- 日本時間の日付 ----
const jstNow = new Date(Date.now() + 9 * 60 * 60 * 1000);
const TY = jstNow.getUTCFullYear();
const TM = jstNow.getUTCMonth() + 1;
const TD = jstNow.getUTCDate();

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(x) {
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  return (x ^ (x >>> 16)) >>> 0;
}

// ---- 各月の日数 ----
const DAYS_IN_MONTH = { 1:31, 2:29, 3:31, 4:30, 5:31, 6:30, 7:31, 8:31, 9:30, 10:31, 11:30, 12:31 };

// ---- 選択肢を作る ----
const selMonth = document.getElementById("selMonth");
const selDay = document.getElementById("selDay");

for (let m = 1; m <= 12; m++) {
  const o = document.createElement("option");
  o.value = m; o.textContent = m;
  selMonth.appendChild(o);
}

function buildDays() {
  const m = Number(selMonth.value);
  const keep = Number(selDay.value) || 1;
  const max = DAYS_IN_MONTH[m];
  selDay.innerHTML = "";
  for (let d = 1; d <= max; d++) {
    const o = document.createElement("option");
    o.value = d; o.textContent = d;
    selDay.appendChild(o);
  }
  selDay.value = String(Math.min(keep, max));
}
selMonth.addEventListener("change", buildDays);
buildDays();

// ---- 生まれた日から花を決める(月を5つの帯に分ける) ----
function flowerFor(month, day) {
  const list = FLOWERS[month];
  const max = DAYS_IN_MONTH[month];
  const idx = Math.min(list.length - 1, Math.floor((day - 1) * list.length / max));
  return list[idx];
}

// ---- 花を描く ----
function drawBloom(color) {
  const bloom = document.getElementById("bloom");
  bloom.querySelectorAll(".petal").forEach(function (p) { p.remove(); });
  for (let i = 0; i < 8; i++) {
    const p = document.createElement("div");
    p.className = "petal";
    const rot = i * 45;
    p.style.setProperty("--rot", rot + "deg");
    p.style.background = "linear-gradient(180deg, " + color + " 0%, " + color + "cc 100%)";
    p.style.animationDelay = (i * 0.055) + "s";
    bloom.insertBefore(p, bloom.firstChild);
  }
}

const inputBlock = document.getElementById("inputBlock");
const resultArea = document.getElementById("resultArea");

function cast() {
  const m = Number(selMonth.value);
  const d = Number(selDay.value);
  const f = flowerFor(m, d);

  document.getElementById("bornLabel").textContent = m + "月" + d + "日 生まれ";
  document.getElementById("flowerName").textContent = f.name;
  document.getElementById("flowerReading").textContent = f.reading;
  document.getElementById("hanakotoba").textContent = f.word;
  document.getElementById("personality").textContent = f.msg;
  document.getElementById("flowerColor").innerHTML =
    '<span class="swatch" style="background:' + f.color + '"></span>' + f.colorName;
  document.getElementById("flowerSeason").textContent = f.season;

  // 今日のお告げ(日付と誕生日で固定。同じ日は何度見ても同じ)
  const seed = hashSeed((TY * 10000 + TM * 100 + TD) * 131 + (m * 100 + d) * 7);
  const rng = mulberry32(seed);
  document.getElementById("oracle").textContent = ORACLES[Math.floor(rng() * ORACLES.length)];
  document.getElementById("todayNote").textContent = TY + "年" + TM + "月" + TD + "日のお告げ";

  drawBloom(f.color);

  try { localStorage.setItem("birthflower_md", m + "-" + d); } catch (e) {}

  inputBlock.style.display = "none";
  resultArea.classList.add("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("castBtn").addEventListener("click", cast);

document.getElementById("retryBtn").addEventListener("click", function () {
  resultArea.classList.remove("show");
  inputBlock.style.display = "flex";
  window.scrollTo({ top: 0, behavior: "smooth" });
});

// 前回選んだ月日を復元
try {
  const saved = localStorage.getItem("birthflower_md");
  if (saved) {
    const p = saved.split("-");
    const m = Number(p[0]), d = Number(p[1]);
    if (m >= 1 && m <= 12 && d >= 1 && d <= DAYS_IN_MONTH[m]) {
      selMonth.value = String(m);
      buildDays();
      selDay.value = String(d);
      cast();
    }
  }
} catch (e) {}
