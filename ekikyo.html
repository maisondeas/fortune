<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易占い ― この先どうなる占い</title>
<meta name="description" content="六本の爻を立て、この先の流れを易占いで占います。">
<style>
  :root {
    --paper: #f2ead8;
    --paper-deep: #e8dcc0;
    --ink: #23201b;
    --ink-soft: #57503f;
    --ink-faint: #8a7f68;
    --red: #a23b2e;
    --red-deep: #7f2e23;
    --gold: #9c7c46;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }
  /* 紙の質感(斑点と淡い滲み) */
  .paper-texture {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 85% 8%, rgba(162, 59, 46, 0.05), transparent 70%),
      radial-gradient(ellipse 50% 35% at 10% 95%, rgba(35, 32, 27, 0.05), transparent 70%);
  }
  .fleck {
    position: absolute;
    background: var(--ink-faint);
    border-radius: 50%;
    opacity: 0.12;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 36px 20px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink);
    text-align: center;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-top: 10px;
    text-align: center;
    line-height: 1.7;
  }
  .divider {
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 22px auto;
  }
  .question-block {
    width: 100%;
    max-width: 280px;
    margin-bottom: 26px;
  }
  .question-block label {
    display: block;
    font-size: 13px;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    color: var(--ink-soft);
    text-align: center;
  }
  #question {
    width: 100%;
    font-size: 16px;
    padding: 11px 14px;
    border-radius: 4px;
    border: 1px solid rgba(35, 32, 27, 0.25);
    background: rgba(255, 255, 255, 0.35);
    color: var(--ink);
    outline: none;
    text-align: center;
    font-family: inherit;
  }
  #question::placeholder { color: rgba(87, 80, 63, 0.5); }
  #question:focus { border-color: var(--red); }
  .guide {
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    margin-bottom: 22px;
    text-align: center;
  }
  /* 卦(六本の爻) */
  .hexagram-stage {
    display: flex;
    flex-direction: column-reverse;
    gap: 13px;
    width: 220px;
    margin-bottom: 28px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    padding: 20px 0;
  }
  .yao {
    height: 15px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    position: relative;
  }
  .yao-bar {
    height: 100%;
    background: var(--ink);
    border-radius: 1px;
    transform: scaleX(0);
    transition: transform 0.5s cubic-bezier(0.3, 0.1, 0.2, 1);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
  }
  .yao.solid .yao-bar { width: 100%; transform-origin: center; }
  .yao.solid.revealed .yao-bar { transform: scaleX(1); }
  .yao.broken .yao-bar { width: 43%; transform-origin: center; }
  .yao.broken.revealed .yao-bar { transform: scaleX(1); }
  .yao.placeholder .yao-bar {
    background: transparent;
    border: 1.5px dashed rgba(87, 80, 63, 0.3);
    transform: scaleX(1);
  }
  .yao.placeholder.solid .yao-bar { width: 100%; }
  .yao.placeholder.broken .yao-bar { width: 43%; }
  /* 結果 */
  .result-area {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: fadeUp 0.7s ease 0.2s both;
  }
  .result-area.show { display: flex; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .question-echo {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    word-break: break-word;
  }
  .hexagram-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 6px;
  }
  .seal {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    background: var(--red);
    color: #f6ead5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border: 2px solid var(--red-deep);
    box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.25);
    transform: rotate(-6deg);
  }
  .hex-name-block { text-align: left; }
  .hex-name {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .hex-reading {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-top: 2px;
  }
  .keyword {
    display: inline-block;
    margin: 14px 0 16px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--red);
    border-top: 1px solid rgba(162, 59, 46, 0.35);
    border-bottom: 1px solid rgba(162, 59, 46, 0.35);
    padding: 5px 18px;
  }
  .message {
    font-size: 15px;
    line-height: 1.9;
    letter-spacing: 0.03em;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid rgba(35, 32, 27, 0.15);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 26px;
  }
  button.retry {
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.1em;
    padding: 12px 34px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
  }
  button.retry:active { background: var(--ink); color: var(--paper); }
  footer {
    position: relative;
    z-index: 1;
    font-size: 11px;
    color: var(--ink-faint);
    padding-bottom: 24px;
    text-align: center;
    line-height: 1.8;
    padding-left: 16px;
    padding-right: 16px;
  }
  @media (min-width: 600px) {
    h1 { font-size: 30px; }
    .hexagram-stage { width: 250px; }
    .hex-name { font-size: 27px; }
  }
</style>
</head>
<body>
<div class="paper-texture" id="paperTexture"></div>
<main>
  <h1>易 占 い</h1>
  <p class="subtitle">六本の爻(こう)を立て、<br>この先の流れを映し出します</p>
  <div class="divider"></div>

  <div class="question-block">
    <label for="question">占いたいこと(入力は任意です)</label>
    <input type="text" id="question" placeholder="例:このまま進めてよいか" maxlength="60">
  </div>

  <p class="guide" id="guide">心の中で問いを思い浮かべて、下の卦をタップしてください</p>

  <div class="hexagram-stage" id="hexStage" role="button" aria-label="卦を立てる" tabindex="0">
    <div class="yao placeholder solid"><div class="yao-bar"></div></div>
    <div class="yao placeholder solid"><div class="yao-bar"></div></div>
    <div class="yao placeholder solid"><div class="yao-bar"></div></div>
    <div class="yao placeholder solid"><div class="yao-bar"></div></div>
    <div class="yao placeholder solid"><div class="yao-bar"></div></div>
    <div class="yao placeholder solid"><div class="yao-bar"></div></div>
  </div>

  <div class="result-area" id="resultArea">
    <p class="question-echo" id="questionEcho"></p>
    <div class="hexagram-header">
      <div class="seal" id="seal"></div>
      <div class="hex-name-block">
        <div class="hex-name" id="hexName"></div>
        <div class="hex-reading" id="hexReading"></div>
      </div>
    </div>
    <div class="keyword" id="keyword"></div>
    <p class="message" id="message"></p>
    <button class="retry" id="retryBtn">もう一度占う</button>
  </div>
</main>
<footer>
  ※占い結果は娯楽としてお楽しみください。<br>
  大切な決断は、ご自身の気持ちを一番に。
</footer>

  const wrap = document.getElementById("paperTexture");
  const count = 40;
  for (let i = 0; i < count; i++) {
    const s = document.createElement("div");
    s.className = "fleck";
    const size = Math.random() * 2 + 1;
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    wrap.appendChild(s);
  }
})();

// ---- 数字を漢数字に変換(1〜64) ----
function toKanji(n) {
  const ones = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
  if (n < 10) return ones[n];
  const tens = Math.floor(n / 10);
  const rem = n % 10;
  let s = tens === 1 ? "十" : ones[tens] + "十";
  if (rem > 0) s += ones[rem];
  return s;
}

const stage = document.getElementById("hexStage");
const yaoEls = Array.from(stage.querySelectorAll(".yao"));
const resultArea = document.getElementById("resultArea");
const guide = document.getElementById("guide");
let casting = false;
let done = false;

function cast() {
  if (casting || done) return;
  casting = true;
  guide.textContent = "卦を立てています…";

  // 六本の爻をランダムに生成(下から上へ)
  const lines = [];
  for (let i = 0; i < 6; i++) lines.push(Math.random() < 0.5 ? 1 : 0);

  // 該当する卦を検索
  const hex = HEXAGRAMS.find(function (h) {
    const bits = TRIGRAM[h.lo].concat(TRIGRAM[h.up]);
    return bits.every(function (b, i) { return b === lines[i]; });
  });
  const hexIndex = HEXAGRAMS.indexOf(hex) + 1;

  // 爻を1本ずつ下から表示
  yaoEls.forEach(function (el, i) {
    el.classList.remove("placeholder", "solid", "broken", "revealed");
    el.classList.add(lines[i] === 1 ? "solid" : "broken");
    setTimeout(function () {
      el.classList.add("revealed");
    }, i * 170 + 30);
  });

  setTimeout(function () {
    const q = document.getElementById("question").value.trim();
    document.getElementById("questionEcho").textContent = q ? "Q. " + q : "";
    document.getElementById("seal").textContent = toKanji(hexIndex);
    document.getElementById("hexName").textContent = hex.name;
    document.getElementById("hexReading").textContent = hex.reading;
    document.getElementById("keyword").textContent = hex.keyword;
    document.getElementById("message").textContent = hex.msg;

    guide.textContent = "卦からのメッセージ";
    resultArea.classList.add("show");
    done = true;
    casting = false;
  }, 6 * 170 + 500);
}

stage.addEventListener("click", cast);
stage.addEventListener("keydown", function (e) {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    cast();
  }
});

document.getElementById("retryBtn").addEventListener("click", function () {
  done = false;
  casting = false;
  resultArea.classList.remove("show");
  yaoEls.forEach(function (el) {
    el.classList.remove("solid", "broken", "revealed");
    el.classList.add("placeholder", "solid");
  });
  guide.textContent = "心の中で問いを思い浮かべて、下の卦をタップしてください";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
