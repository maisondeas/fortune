<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バイオリズム ― 身体・感情・知性の波</title>
<meta name="description" content="生年月日から、身体・感情・知性の3つの波を計算してグラフで表示します。">
<style>
  :root {
    --ink1: #21242b;
    --ink2: #2b2f38;
    --ink3: #1a1c22;
    --panel: rgba(255, 255, 255, 0.045);
    --fg: #e7e9ee;
    --fg-soft: rgba(231, 233, 238, 0.72);
    --fg-faint: rgba(231, 233, 238, 0.42);
    --grid: rgba(231, 233, 238, 0.13);
    --line: rgba(231, 233, 238, 0.16);
    --body: #ff6f61;
    --emo: #4fc0ee;
    --mind: #a4cf6a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(168deg, var(--ink1) 0%, var(--ink2) 55%, var(--ink3) 100%);
    color: var(--fg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }
  /* 方眼の気配 */
  .mesh {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(231, 233, 238, 0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(231, 233, 238, 0.028) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 470px;
    padding: 38px 18px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-align: center;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--fg-soft);
    margin-top: 10px;
    text-align: center;
    line-height: 1.7;
  }
  .divider {
    width: 96px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--fg-faint), transparent);
    margin: 22px auto 26px;
  }
  /* 入力 */
  .input-block {
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
  }
  .input-block label {
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--fg-soft);
    margin-bottom: 10px;
  }
  #birth {
    width: 100%;
    font-size: 16px;
    font-family: inherit;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.07);
    color: var(--fg);
    outline: none;
    text-align: center;
  }
  #birth:focus { border-color: var(--emo); }
  button.cast {
    margin-top: 18px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.12em;
    padding: 13px 44px;
    border-radius: 999px;
    border: 1px solid var(--fg-faint);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    transition: background 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  button.cast:active { background: rgba(255, 255, 255, 0.12); }
  .notice {
    font-size: 12.5px;
    color: var(--body);
    margin-top: 12px;
    min-height: 18px;
    text-align: center;
  }
  /* 結果 */
  .result-area {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 0.6s ease both;
  }
  .result-area.show { display: flex; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .result-area { animation: none !important; }
    .curve { stroke-dasharray: none !important; animation: none !important; }
  }
  .meta {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--fg-faint);
    text-align: center;
    line-height: 1.8;
    margin-bottom: 16px;
  }
  .meta b { color: var(--fg-soft); font-weight: 600; }
  /* グラフ */
  .chart-wrap {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 8px 8px;
  }
  svg.chart { width: 100%; height: auto; display: block; }
  .curve {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1400;
    stroke-dashoffset: 1400;
    animation: drawLine 1.4s ease-out forwards;
  }
  @keyframes drawLine { to { stroke-dashoffset: 0; } }
  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--fg-soft);
  }
  .legend-dot { width: 10px; height: 3px; border-radius: 2px; }
  /* 各リズム */
  .rhythms { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 11px; }
  .rhythm {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid;
    border-radius: 9px;
    padding: 15px 16px;
  }
  .rhythm-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 9px;
    flex-wrap: wrap;
  }
  .rhythm-name {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  .rhythm-cycle { font-size: 11px; color: var(--fg-faint); letter-spacing: 0.06em; }
  .rhythm-value {
    margin-left: auto;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 19px;
    font-weight: 700;
  }
  .rhythm-state {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.14em;
    padding: 3px 11px;
    border-radius: 999px;
    border: 1px solid;
    margin-bottom: 10px;
  }
  .rhythm-text {
    font-size: 14px;
    line-height: 1.85;
    letter-spacing: 0.02em;
    color: rgba(231, 233, 238, 0.92);
  }
  .rhythm-next {
    font-size: 11.5px;
    color: var(--fg-faint);
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid var(--line);
    letter-spacing: 0.04em;
  }
  /* 総括 */
  .summary {
    width: 100%;
    margin-top: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 17px 18px;
  }
  .summary-label {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 12.5px;
    letter-spacing: 0.22em;
    color: var(--fg-faint);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .summary-text { font-size: 14.5px; line-height: 1.9; letter-spacing: 0.02em; }
  button.retry {
    margin-top: 26px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.1em;
    padding: 12px 34px;
    border-radius: 999px;
    border: 1px solid var(--fg-faint);
    background: transparent;
    color: var(--fg-soft);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.retry:active { background: rgba(255, 255, 255, 0.1); }
  footer {
    position: relative;
    z-index: 1;
    font-size: 11px;
    color: var(--fg-faint);
    padding: 0 16px 26px;
    text-align: center;
    line-height: 2.1;
    max-width: 470px;
  }
  footer a { color: var(--emo); text-decoration: none; }
  footer a:active { opacity: 0.7; }
  @media (min-width: 600px) {
    h1 { font-size: 28px; }
    .rhythm-name { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="mesh"></div>
<main>
  <h1>バイオリズム</h1>
  <p class="subtitle">身体・感情・知性。<br>生まれた日から続く3つの波を測ります</p>
  <div class="divider"></div>

  <div class="input-block" id="inputBlock">
    <label for="birth">生年月日を選んでください</label>
    <input type="date" id="birth" min="1900-01-01">
    <button class="cast" id="castBtn">波を測る</button>
    <p class="notice" id="notice"></p>
  </div>

  <div class="result-area" id="resultArea">
    <p class="meta" id="meta"></p>

    <div class="chart-wrap">
      <svg class="chart" id="chart" viewBox="0 0 620 250" preserveAspectRatio="xMidYMid meet" role="img" aria-label="バイオリズムのグラフ"></svg>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--body)"></span>身体</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--emo)"></span>感情</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--mind)"></span>知性</div>
      </div>
    </div>

    <div class="rhythms" id="rhythms"></div>

    <div class="summary">
      <div class="summary-label">今 日 の 総 括</div>
      <p class="summary-text" id="summaryText"></p>
    </div>

    <button class="retry" id="retryBtn">生年月日を選び直す</button>
  </div>
</main>
<footer>
  ※バイオリズムの周期には科学的な裏づけがありません。<br>
  娯楽としてお楽しみいただき、体調の判断は医師にご相談ください。<br>
  <a href="index.html">占いの扉へ戻る</a>
</footer>

<script>
// ---- 3つのリズムの定義 ----
const RHYTHMS = [
  {
    key: "body", name: "身体リズム", cycle: 23, color: "var(--body)", raw: "#ff6f61",
    high: "体が軽く、動きたくなる時期です。運動や外出、力仕事も苦になりません。体力が必要な予定は、今のうちに入れておくと良いでしょう。",
    low: "疲れが出やすい時期です。無理を重ねると後に響くので、休息を多めに取ってください。予定は少なめに組むのが賢明です。",
    zero: "身体リズムが切り替わる日です。体調が不安定になりやすいので、けがや無理な予定には気をつけてください。"
  },
  {
    key: "emo", name: "感情リズム", cycle: 28, color: "var(--emo)", raw: "#4fc0ee",
    high: "気持ちが安定し、人との関わりを楽しめる時期です。誘いには乗って吉。あなたの明るさが周囲にも伝わります。",
    low: "気分が沈みやすい時期です。感情的な判断は避け、ひとりで過ごす時間も意識して確保してください。",
    zero: "感情リズムが切り替わる日です。苛立ちや落ち込みが出やすいので、言葉選びには少し気を配ってください。"
  },
  {
    key: "mind", name: "知性リズム", cycle: 33, color: "var(--mind)", raw: "#a4cf6a",
    high: "頭がよく回る時期です。企画、勉強、細かい作業に向いています。判断を要することは今のうちに済ませておきましょう。",
    low: "判断が鈍りやすい時期です。重要な決断や契約、複雑な計算は先送りするのが無難です。",
    zero: "知性リズムが切り替わる日です。うっかりミスや思い違いが起きやすいので、確認をひとつ増やしてください。"
  }
];

// ---- 総括(高調期の数で分岐) ----
const SUMMARIES = {
  3: "3つの波がそろって高い、絶好調の一日です。やりたいことに思い切って取り組んで構いません。この状態は長くは続かないので、今日を存分に活かしてください。",
  2: "2つの波が高い、良い状態の一日です。低いほうの分野だけ無理をしなければ、おおむね順調に運びます。",
  1: "波の高低が分かれる一日です。高い分野にできることを寄せて、低い分野は控えめにすると、うまく乗り切れます。",
  0: "3つの波がそろって低い、休養向きの一日です。頑張りどころではありません。予定を減らして、力を蓄えることを優先してください。"
};

const NOTICE_SUMMARY = "今日は要注意日にあたるリズムがあります。切り替わりの日は調子が読みにくいので、大事な予定は慎重に進めてください。";

// ---- 日本時間の今日 ----
function jstToday() {
  const j = new Date(Date.now() + 9 * 60 * 60 * 1000);
  return { y: j.getUTCFullYear(), m: j.getUTCMonth() + 1, d: j.getUTCDate() };
}

// ---- 日付を通算日数に変換(UTC基準で時差の影響を受けない) ----
function toDayNumber(y, m, d) {
  return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
}

const birthInput = document.getElementById("birth");
const notice = document.getElementById("notice");
const inputBlock = document.getElementById("inputBlock");
const resultArea = document.getElementById("resultArea");

try {
  const saved = localStorage.getItem("biorhythm_birth");
  if (saved) birthInput.value = saved;
} catch (e) {}

// ---- 波の値(-1 〜 +1) ----
function wave(days, cycle) {
  return Math.sin(2 * Math.PI * days / cycle);
}

// ---- 状態を判定 ----
function stateOf(days, cycle) {
  const today = wave(days, cycle);
  const tomorrow = wave(days + 1, cycle);
  // 値がほぼ0の日、または翌日までに0を横切る日が要注意日
  if (Math.abs(today) < 1e-9) return "zero";
  if ((today > 0) !== (tomorrow > 0)) return "zero";
  return today > 0 ? "high" : "low";
}

// ---- 次の要注意日を探す ----
function nextZeroDay(days, cycle) {
  for (let i = 1; i <= 40; i++) {
    if (stateOf(days + i, cycle) === "zero") return i;
  }
  return null;
}

const STATE_LABEL = {
  high: { text: "高 調 期", color: "#8ddc9a" },
  low:  { text: "低 調 期", color: "#8f97a8" },
  zero: { text: "要 注 意 日", color: "#ffc861" }
};

// ---- グラフを描く ----
function drawChart(birthDays, todayDays) {
  const svg = document.getElementById("chart");
  const W = 620, H = 250;
  const L = 38, R = 606, T = 20, B = 200;
  const zeroY = (T + B) / 2;
  const amp = (B - T) / 2;
  const SPAN = 15; // 前後15日

  function x(offset) { return L + (offset + SPAN) / (SPAN * 2) * (R - L); }
  function y(v) { return zeroY - v * amp; }

  let out = "";

  // 横の目盛り
  [1, 0.5, 0, -0.5, -1].forEach(function (v) {
    const yy = y(v);
    out += '<line x1="' + L + '" y1="' + yy + '" x2="' + R + '" y2="' + yy +
           '" stroke="' + (v === 0 ? "rgba(231,233,238,0.32)" : "rgba(231,233,238,0.12)") +
           '" stroke-width="1"/>';
    out += '<text x="' + (L - 7) + '" y="' + (yy + 3.5) +
           '" fill="rgba(231,233,238,0.42)" font-size="10" text-anchor="end">' +
           (v * 100) + "</text>";
  });

  // 縦の目盛り(5日ごと)
  for (let o = -SPAN; o <= SPAN; o += 5) {
    const xx = x(o);
    out += '<line x1="' + xx + '" y1="' + T + '" x2="' + xx + '" y2="' + B +
           '" stroke="rgba(231,233,238,0.09)" stroke-width="1"/>';
    const label = o === 0 ? "今日" : (o > 0 ? "+" + o : String(o));
    out += '<text x="' + xx + '" y="' + (B + 16) +
           '" fill="rgba(231,233,238,' + (o === 0 ? "0.85" : "0.4") +
           ')" font-size="10.5" text-anchor="middle">' + label + "</text>";
  }

  // 今日の縦線
  out += '<line x1="' + x(0) + '" y1="' + (T - 4) + '" x2="' + x(0) + '" y2="' + (B + 4) +
         '" stroke="rgba(231,233,238,0.5)" stroke-width="1" stroke-dasharray="3 3"/>';

  // 3本の曲線
  RHYTHMS.forEach(function (r, i) {
    let pts = [];
    for (let o = -SPAN; o <= SPAN; o += 0.25) {
      const v = wave(todayDays - birthDays + o, r.cycle);
      pts.push(x(o).toFixed(1) + "," + y(v).toFixed(1));
    }
    out += '<polyline class="curve" points="' + pts.join(" ") +
           '" stroke="' + r.raw + '" style="animation-delay:' + (i * 0.18) + 's"/>';
  });

  // 今日の位置に印
  RHYTHMS.forEach(function (r) {
    const v = wave(todayDays - birthDays, r.cycle);
    out += '<circle cx="' + x(0) + '" cy="' + y(v) + '" r="4.5" fill="' + r.raw +
           '" stroke="#21242b" stroke-width="1.5"/>';
  });

  // 軸のラベル
  out += '<text x="' + ((L + R) / 2) + '" y="' + (H - 8) +
         '" fill="rgba(231,233,238,0.34)" font-size="10" text-anchor="middle">前後15日間の推移(単位:%)</text>';

  svg.innerHTML = out;
}

function cast() {
  const val = birthInput.value;
  if (!val) { notice.textContent = "生年月日を選んでください"; return; }
  const p = val.split("-");
  const by = Number(p[0]), bm = Number(p[1]), bd = Number(p[2]);
  if (!by || !bm || !bd) { notice.textContent = "生年月日を正しく選んでください"; return; }

  const t = jstToday();
  const birthDays = toDayNumber(by, bm, bd);
  const todayDays = toDayNumber(t.y, t.m, t.d);
  const elapsed = todayDays - birthDays;

  if (elapsed < 0) {
    notice.textContent = "未来の日付は選べません";
    return;
  }
  notice.textContent = "";
  try { localStorage.setItem("biorhythm_birth", val); } catch (e) {}

  document.getElementById("meta").innerHTML =
    t.y + "年" + t.m + "月" + t.d + "日<br>" +
    "生まれてから <b>" + elapsed.toLocaleString() + "</b> 日目";

  // 各リズム
  const wrap = document.getElementById("rhythms");
  wrap.innerHTML = "";
  let highCount = 0;
  let hasZero = false;

  RHYTHMS.forEach(function (r) {
    const v = wave(elapsed, r.cycle);
    const st = stateOf(elapsed, r.cycle);
    if (st === "high") highCount++;
    if (st === "zero") hasZero = true;

    const label = STATE_LABEL[st];
    const pct = Math.round(v * 100);
    const nz = nextZeroDay(elapsed, r.cycle);

    const box = document.createElement("div");
    box.className = "rhythm";
    box.style.borderLeftColor = r.raw;
    box.innerHTML =
      '<div class="rhythm-head">' +
        '<span class="rhythm-name" style="color:' + r.raw + '">' + r.name + "</span>" +
        '<span class="rhythm-cycle">' + r.cycle + "日周期</span>" +
        '<span class="rhythm-value" style="color:' + r.raw + '">' +
          (pct > 0 ? "+" : "") + pct + "%</span>" +
      "</div>" +
      '<span class="rhythm-state" style="color:' + label.color + ';border-color:' + label.color + '44">' +
        label.text + "</span>" +
      '<div class="rhythm-text">' + r[st] + "</div>" +
      (nz !== null
        ? '<div class="rhythm-next">次の要注意日 … ' + nz + "日後</div>"
        : "");
    wrap.appendChild(box);
  });

  document.getElementById("summaryText").textContent =
    hasZero ? NOTICE_SUMMARY : SUMMARIES[highCount];

  drawChart(birthDays, todayDays);

  inputBlock.style.display = "none";
  resultArea.classList.add("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("castBtn").addEventListener("click", cast);
birthInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); cast(); }
});
document.getElementById("retryBtn").addEventListener("click", function () {
  resultArea.classList.remove("show");
  inputBlock.style.display = "flex";
  notice.textContent = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
});

// 前回の生年月日があれば自動で表示
try {
  if (birthInput.value) cast();
} catch (e) {}
</script>
</body>
</html>
