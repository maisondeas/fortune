<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ</title>
<meta name="description" content="筒を振って、今日のおみくじを一本引きます。">
<style>
  :root {
    --shu1: #8f1d18;
    --shu2: #b53a2b;
    --shu-deep: #6d130f;
    --pearl: #fdf1e6;
    --pearl-soft: rgba(253, 241, 230, 0.75);
    --pearl-faint: rgba(253, 241, 230, 0.45);
    --strip: #fdf6ef;
    --strip-edge: #f0e2d4;
    --sumi: #3a2622;
    --sumi-soft: #6d564f;
    --line: rgba(253, 241, 230, 0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(170deg, var(--shu1) 0%, var(--shu2) 55%, var(--shu-deep) 100%);
    color: var(--pearl);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }
  /* 背景の光と紗綾形の気配 */
  .veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 0%, rgba(253, 241, 230, 0.14), transparent 48%),
      radial-gradient(circle at 12% 88%, rgba(0, 0, 0, 0.18), transparent 55%);
  }
  .mote {
    position: absolute;
    background: var(--pearl);
    border-radius: 50%;
    opacity: 0.16;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    padding: 40px 20px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-align: center;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--pearl-soft);
    margin-top: 10px;
    text-align: center;
    line-height: 1.7;
  }
  .divider {
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pearl-faint), transparent);
    margin: 24px auto 30px;
  }
  .guide {
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--pearl-soft);
    margin-bottom: 22px;
    text-align: center;
    min-height: 20px;
  }
  /* 御籤筒 */
  .box-stage {
    height: 210px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 30px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .box-wrap {
    position: relative;
    width: 96px;
    transform-origin: 50% 100%;
  }
  .box-wrap.shaking { animation: shake 0.62s ease-in-out 3; }
  @keyframes shake {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    20% { transform: rotate(-13deg) translateY(-8px); }
    50% { transform: rotate(11deg) translateY(-4px); }
    75% { transform: rotate(-7deg) translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .box-wrap.shaking { animation: none; }
    .stick, .strip, .result-area { transition: none !important; animation: none !important; }
  }
  /* 出てくる籤 */
  .stick {
    position: absolute;
    left: 50%;
    bottom: 128px;
    width: 13px;
    height: 92px;
    margin-left: -6.5px;
    background: linear-gradient(180deg, #e8d5b8 0%, #d8bf9c 100%);
    border-radius: 3px 3px 1px 1px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    transform: translateY(96px);
    opacity: 0;
    transition: transform 0.75s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s;
    z-index: 0;
  }
  .stick::after {
    content: "";
    position: absolute;
    left: 2px;
    right: 2px;
    top: 8px;
    height: 3px;
    background: var(--shu-deep);
    border-radius: 1px;
  }
  .stick.out { transform: translateY(0); opacity: 1; }
  .box-body {
    position: relative;
    z-index: 1;
    height: 132px;
    border-radius: 7px 7px 5px 5px;
    background:
      linear-gradient(90deg,
        rgba(0, 0, 0, 0.3) 0%,
        rgba(255, 255, 255, 0.16) 26%,
        rgba(255, 255, 255, 0.05) 52%,
        rgba(0, 0, 0, 0.32) 100%),
      linear-gradient(180deg, #a8281f, #7d1811);
    border: 1px solid rgba(0, 0, 0, 0.3);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 12px;
  }
  .box-lid {
    position: absolute;
    z-index: 2;
    top: -9px;
    left: -7px;
    right: -7px;
    height: 18px;
    border-radius: 4px;
    background: linear-gradient(180deg, #2f1a15, #1d0f0c);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
  }
  .box-hole {
    position: absolute;
    z-index: 3;
    top: -3px;
    left: 50%;
    margin-left: -8px;
    width: 16px;
    height: 6px;
    border-radius: 2px;
    background: #120806;
  }
  .box-label {
    writing-mode: vertical-rl;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 19px;
    letter-spacing: 0.28em;
    color: var(--pearl);
    opacity: 0.9;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  /* 御神籤(紙) */
  .result-area {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
  }
  .result-area.show { display: flex; }
  .strip {
    position: relative;
    width: 100%;
    background: var(--strip);
    color: var(--sumi);
    border: 1px solid var(--strip-edge);
    border-radius: 3px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
    padding: 26px 22px 24px 44px;
    transform-origin: top center;
    animation: unfurl 0.8s cubic-bezier(0.25, 0.9, 0.3, 1) both;
  }
  @keyframes unfurl {
    from { transform: scaleY(0.02); opacity: 0.4; }
    to { transform: scaleY(1); opacity: 1; }
  }
  .strip::before {
    content: "";
    position: absolute;
    left: 22px;
    top: 14px;
    bottom: 14px;
    width: 1px;
    background: rgba(58, 38, 34, 0.18);
  }
  .strip-label {
    position: absolute;
    left: 6px;
    top: 20px;
    writing-mode: vertical-rl;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--shu2);
  }
  .fortune {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--shu1);
    text-align: center;
    line-height: 1.15;
  }
  .fortune-rank {
    font-size: 11.5px;
    letter-spacing: 0.24em;
    color: var(--sumi-soft);
    text-align: center;
    margin-top: 8px;
  }
  .verse {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 15px;
    line-height: 1.95;
    letter-spacing: 0.05em;
    text-align: center;
    margin: 20px 0 22px;
    padding: 16px 6px;
    border-top: 1px solid rgba(58, 38, 34, 0.15);
    border-bottom: 1px solid rgba(58, 38, 34, 0.15);
  }
  .fields { display: flex; flex-direction: column; gap: 13px; }
  .field { display: flex; gap: 12px; align-items: baseline; }
  .field-name {
    flex-shrink: 0;
    width: 4.6em;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--shu1);
  }
  .field-text {
    flex: 1;
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--sumi);
  }
  .lucky {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(58, 38, 34, 0.15);
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .lucky-row { display: flex; gap: 12px; align-items: center; }
  .lucky-name {
    flex-shrink: 0;
    width: 4.6em;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: var(--shu1);
  }
  .lucky-text { font-size: 13.5px; color: var(--sumi); }
  .swatch {
    display: inline-block;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 1px solid rgba(58, 38, 34, 0.28);
    margin-right: 8px;
    vertical-align: -2px;
  }
  button.retry {
    margin-top: 30px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: 0.12em;
    padding: 13px 38px;
    border-radius: 999px;
    border: 1px solid var(--pearl-faint);
    background: transparent;
    color: var(--pearl);
    cursor: pointer;
    transition: background 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  button.retry:active { background: rgba(253, 241, 230, 0.15); }
  footer {
    position: relative;
    z-index: 1;
    font-size: 11px;
    color: var(--pearl-faint);
    padding: 0 16px 26px;
    text-align: center;
    line-height: 1.8;
  }
  @media (min-width: 600px) {
    h1 { font-size: 30px; }
    .fortune { font-size: 60px; }
    .box-wrap { width: 108px; }
  }
</style>
</head>
<body>
<div class="veil" id="veil"></div>
<main>
  <h1>お み く じ</h1>
  <p class="subtitle">心を静めて、<br>今日の一本を引いてください</p>
  <div class="divider"></div>

  <p class="guide" id="guide">筒をタップすると振れます</p>

  <div class="box-stage" id="boxStage" role="button" aria-label="おみくじを引く" tabindex="0">
    <div class="box-wrap" id="boxWrap">
      <div class="stick" id="stick"></div>
      <div class="box-body">
        <div class="box-lid"></div>
        <div class="box-hole"></div>
        <div class="box-label">御籤</div>
      </div>
    </div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="strip">
      <div class="strip-label">御神籤</div>
      <div class="fortune" id="fortune"></div>
      <div class="fortune-rank" id="fortuneRank"></div>
      <p class="verse" id="verse"></p>
      <div class="fields" id="fields"></div>
      <div class="lucky">
        <div class="lucky-row">
          <div class="lucky-name">幸運の色</div>
          <div class="lucky-text" id="luckyColor"></div>
        </div>
        <div class="lucky-row">
          <div class="lucky-name">幸運の品</div>
          <div class="lucky-text" id="luckyItem"></div>
        </div>
      </div>
    </div>
    <button class="retry" id="retryBtn">もう一度引く</button>
  </div>
</main>
<footer>
  ※占い結果は娯楽としてお楽しみください。<br>
  大切な決断は、ご自身の気持ちを一番に。
</footer>

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ---- 重み付き抽選 ----
function drawFortune() {
  const total = FORTUNES.reduce(function (a, f) { return a + f.weight; }, 0);
  let r = Math.random() * total;
  for (let i = 0; i < FORTUNES.length; i++) {
    r -= FORTUNES[i].weight;
    if (r < 0) return FORTUNES[i];
  }
  return FORTUNES[FORTUNES.length - 1];
}

let done = false;

function draw() {
  if (busy || done) return;
  busy = true;
  guide.textContent = "筒を振っています…";

  boxWrap.classList.add("shaking");

  setTimeout(function () {
    boxWrap.classList.remove("shaking");
    stick.classList.add("out");
    guide.textContent = "一本、出ました";
  }, 1900);

  setTimeout(function () {
    const f = drawFortune();

    document.getElementById("fortune").textContent = f.name;
    document.getElementById("fortuneRank").textContent = f.rank;
    document.getElementById("verse").textContent = pick(f.verses);

    const fieldsWrap = document.getElementById("fields");
    fieldsWrap.innerHTML = "";
    FIELDS.forEach(function (fd) {
      const row = document.createElement("div");
      row.className = "field";
      const nm = document.createElement("div");
      nm.className = "field-name";
      nm.textContent = fd.label;
      const tx = document.createElement("div");
      tx.className = "field-text";
      tx.textContent = pick(fd.lines[f.tier]);
      row.appendChild(nm);
      row.appendChild(tx);
      fieldsWrap.appendChild(row);
    });

    const c = pick(COLORS);
    document.getElementById("luckyColor").innerHTML =
      '<span class="swatch" style="background:' + c.hex + '"></span>' + c.name;
    document.getElementById("luckyItem").textContent = pick(ITEMS);

    guide.textContent = "今日のおみくじ";
    resultArea.classList.add("show");
    done = true;
    busy = false;
  }, 2750);
}

stage.addEventListener("click", draw);
stage.addEventListener("keydown", function (e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); draw(); }
});

document.getElementById("retryBtn").addEventListener("click", function () {
  done = false;
  busy = false;
  resultArea.classList.remove("show");
  stick.classList.remove("out");
  guide.textContent = "筒をタップすると振れます";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
